name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.14

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Check frontend
        working-directory: frontend
        run: bun run check
      - name: Build frontend
        working-directory: frontend
        run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  native:
    name: Build ${{ matrix.label }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            bundle: grindfesta-engine-windows-x64
            archive: grindfesta-engine-windows-x64.zip
            binary: grindfesta-engine.exe
            bun_binary: bun.exe
          - label: macOS Apple Silicon
            runner: macos-15
            bundle: grindfesta-engine-macos-arm64
            archive: grindfesta-engine-macos-arm64.zip
            binary: grindfesta-engine
            bun_binary: bun
          - label: macOS Intel
            runner: macos-15-intel
            bundle: grindfesta-engine-macos-x64
            archive: grindfesta-engine-macos-x64.zip
            binary: grindfesta-engine
            bun_binary: bun
    runs-on: ${{ matrix.runner }}
    env:
      BUNDLE_NAME: ${{ matrix.bundle }}
      ARCHIVE_NAME: ${{ matrix.archive }}
      ENGINE_BINARY: ${{ matrix.binary }}
      BUN_BINARY: ${{ matrix.bun_binary }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Test backend
        working-directory: backend
        shell: bash
        run: cargo test --locked --workspace
      - name: Build backend
        working-directory: backend
        shell: bash
        run: cargo build --locked --release -p main
      - name: Stage bundle
        shell: bash
        run: |
          mkdir -p "release/$BUNDLE_NAME/frontend" "release/$BUNDLE_NAME/runtime"
          cp -R frontend/dist/. "release/$BUNDLE_NAME/frontend/"
          cp "backend/target/release/$ENGINE_BINARY" "release/$BUNDLE_NAME/$ENGINE_BINARY"
          cp "$(command -v bun)" "release/$BUNDLE_NAME/runtime/$BUN_BINARY"
          cp third_party/bun/LICENSE.md "release/$BUNDLE_NAME/runtime/BUN-LICENSE.md"
          cp README.md "release/$BUNDLE_NAME/README.md"
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod +x "release/$BUNDLE_NAME/$ENGINE_BINARY" "release/$BUNDLE_NAME/runtime/$BUN_BINARY"
          fi
      - name: Smoke test macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "release/$BUNDLE_NAME"
          GRINDFESTA_NO_OPEN=1 "./$ENGINE_BINARY" >engine.log 2>&1 &
          engine_pid=$!
          cleanup() {
            kill "$engine_pid" 2>/dev/null || true
            wait "$engine_pid" 2>/dev/null || true
            rm -f db db-shm db-wal engine.log
            rmdir projects 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:9002/health >/dev/null; then
              break
            fi
            sleep 0.5
          done
          if ! curl --fail --silent http://localhost:9002/health | grep --quiet '^ok$'; then
            cat engine.log
            exit 1
          fi
          if ! curl --fail --silent http://localhost:9002/ | grep --quiet '<title>Grindfesta Engine</title>'; then
            cat engine.log
            exit 1
          fi
      - name: Smoke test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Resolve-Path "release/$env:BUNDLE_NAME"
          $env:GRINDFESTA_NO_OPEN = "1"
          $process = Start-Process -FilePath "$bundle/$env:ENGINE_BINARY" `
            -WorkingDirectory $bundle -PassThru `
            -RedirectStandardOutput "$bundle/engine.out.log" `
            -RedirectStandardError "$bundle/engine.err.log"
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $health = Invoke-WebRequest http://localhost:9002/health
                if ($health.Content -eq "ok") { $ready = $true; break }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) {
              Get-Content "$bundle/engine.out.log", "$bundle/engine.err.log"
              throw "Engine did not become ready"
            }
            $editor = Invoke-WebRequest http://localhost:9002/
            if ($editor.Content -notmatch '<title>Grindfesta Engine</title>') {
              throw "Editor HTML was not served"
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $process.WaitForExit()
            Remove-Item "$bundle/db", "$bundle/db-shm", "$bundle/db-wal", `
              "$bundle/engine.out.log", "$bundle/engine.err.log" -Force -ErrorAction SilentlyContinue
            Remove-Item "$bundle/projects" -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Package macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd release
          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE_NAME" "../$ARCHIVE_NAME"
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "release/$env:BUNDLE_NAME" -DestinationPath "$env:ARCHIVE_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.bundle }}
          path: ${{ matrix.archive }}
          retention-days: 14
      - name: Attach archive to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ARCHIVE_NAME" --clobber

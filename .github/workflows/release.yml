name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the rebuilt archives
        required: false
        type: string

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.14

jobs:
  validation:
    name: Validate source and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-test-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-test-
      - name: Check and build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
      - name: Test backend
        working-directory: backend
        run: cargo test --locked --workspace
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  native:
    name: Compile ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows x64, runner: windows-latest, bundle: grindfesta-engine-windows-x64, binary: grindfesta-engine.exe }
          - { label: macOS Apple Silicon, runner: macos-15, bundle: grindfesta-engine-macos-arm64, binary: grindfesta-engine }
          - { label: macOS Intel, runner: macos-15-intel, bundle: grindfesta-engine-macos-x64, binary: grindfesta-engine }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-release-
      - name: Build backend
        working-directory: backend
        shell: bash
        run: cargo build --locked --release -p main
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.bundle }}
          path: backend/target/release/${{ matrix.binary }}
          retention-days: 7

  package:
    name: Package ${{ matrix.label }}
    needs: [validation, native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows x64, runner: windows-latest, bundle: grindfesta-engine-windows-x64, binary: grindfesta-engine.exe, bun: bun.exe }
          - { label: macOS Apple Silicon, runner: macos-15, bundle: grindfesta-engine-macos-arm64, binary: grindfesta-engine, bun: bun }
          - { label: macOS Intel, runner: macos-15-intel, bundle: grindfesta-engine-macos-x64, binary: grindfesta-engine, bun: bun }
    runs-on: ${{ matrix.runner }}
    env:
      BUNDLE_NAME: ${{ matrix.bundle }}
      ARCHIVE_NAME: ${{ matrix.bundle }}.zip
      ENGINE_BINARY: ${{ matrix.binary }}
      BUN_BINARY: ${{ matrix.bun }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.bundle }}
          path: native
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Stage bundle
        shell: bash
        run: |
          mkdir -p "release/$BUNDLE_NAME/frontend" "release/$BUNDLE_NAME/runtime"
          cp -R frontend/dist/. "release/$BUNDLE_NAME/frontend/"
          cp "native/$ENGINE_BINARY" "release/$BUNDLE_NAME/$ENGINE_BINARY"
          cp "$(command -v bun)" "release/$BUNDLE_NAME/runtime/$BUN_BINARY"
          cp third_party/bun/LICENSE.md "release/$BUNDLE_NAME/runtime/BUN-LICENSE.md"
          cp README.md "release/$BUNDLE_NAME/README.md"
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod +x "release/$BUNDLE_NAME/$ENGINE_BINARY" "release/$BUNDLE_NAME/runtime/$BUN_BINARY"
          fi
      - name: Smoke test macOS bundle
        if: runner.os == 'macOS'
        run: bash scripts/smoke-release.sh "release/$BUNDLE_NAME" "$ENGINE_BINARY"
      - name: Smoke test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-release.ps1 "release/$env:BUNDLE_NAME" "$env:ENGINE_BINARY"
      - name: Package macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd release
          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE_NAME" "../$ARCHIVE_NAME"
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "release/$env:BUNDLE_NAME" -DestinationPath "$env:ARCHIVE_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.bundle }}
          path: ${{ matrix.bundle }}.zip
          compression-level: 0
          retention-days: 14
      - name: Attach archive to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE_NAME" --clobber
